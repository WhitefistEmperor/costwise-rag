[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "costwise-rag"
version = "0.1.0"
description = "RAG service with a semantic cache and a cost-aware model router"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "scikit-learn",
  "sentence-transformers",
  "httpx",
  "fastapi",
  "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]
charts = ["matplotlib"]
# Public benchmarks (eval/beir.py, paraphrase.py, routerbench.py, train_verifier.py)
bench = ["pandas", "pyarrow", "huggingface_hub", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
costwise = ["app/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
